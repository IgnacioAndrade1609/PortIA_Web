<div class="pv-page">
  <div class="pv-title-row">
    <h4 class="pv-page-title pv-spacer">Gestión de usuarios</h4>
    <button matButton="filled" class="btn-primary" (click)="mostrandoFormulario.set(!mostrandoFormulario())">
      <mat-icon>{{ mostrandoFormulario() ? 'close' : 'add' }}</mat-icon>
      {{ mostrandoFormulario() ? 'Cancelar' : 'Nuevo usuario' }}
    </button>
  </div>

  @if (error()) {
    <p class="login-error">{{ error() }}</p>
  }

  @if (mostrandoFormulario()) {
    <form [formGroup]="form" (ngSubmit)="crear()" class="pv-box pv-section">
      <div class="pv-form-row">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="pv-col-3">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombreUsuario" />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="pv-col-3">
          <mat-label>Correo</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="pv-col-3">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="pv-col-3">
          <mat-label>Rol</mat-label>
          <mat-select formControlName="rolId">
            @for (rol of roles(); track rol.id) {
              <mat-option [value]="rol.id">{{ rol.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="pv-form-actions">
        <button matButton="filled" class="btn-primary" type="submit" [disabled]="guardando()">Crear usuario</button>
      </div>
    </form>
  }

  <table mat-table [dataSource]="usuarios()" class="pv-table-full mat-elevation-z1">
    <ng-container matColumnDef="nombreUsuario">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let u">{{ u.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="rol">
      <th mat-header-cell *matHeaderCellDef>Rol</th>
      <td mat-cell *matCellDef="let u">{{ u.role.name }}</td>
    </ng-container>

    <ng-container matColumnDef="vigente">
      <th mat-header-cell *matHeaderCellDef>Activo</th>
      <td mat-cell *matCellDef="let u">
        <mat-slide-toggle [checked]="u.active" (change)="alternarVigencia(u)" />
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
</div>
