<div class="pv-page">
  <div class="pv-title-row">
    <h4 class="pv-page-title">{{ esAnalista() ? 'Mis alertas' : 'Alertas del equipo' }}</h4>
  </div>

  <table mat-table [dataSource]="alertas()" class="pv-table-full mat-elevation-z1">
    <ng-container matColumnDef="numeroContainer">
      <th mat-header-cell *matHeaderCellDef>Contenedor</th>
      <td mat-cell *matCellDef="let a">{{ a.numeroContainer }}</td>
    </ng-container>

    <ng-container matColumnDef="tipoAlerta">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let a">{{ a.tipoAlerta }}</td>
    </ng-container>

    <ng-container matColumnDef="nivelRiesgo">
      <th mat-header-cell *matHeaderCellDef>Riesgo</th>
      <td mat-cell *matCellDef="let a"><app-risk-badge [nivel]="a.nivelRiesgo" /></td>
    </ng-container>

    <ng-container matColumnDef="mensaje">
      <th mat-header-cell *matHeaderCellDef>Mensaje</th>
      <td mat-cell *matCellDef="let a">{{ a.mensaje }}</td>
    </ng-container>

    <ng-container matColumnDef="createAt">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let a">{{ a.createAt | date: 'dd-MM-yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="analistaAsignado">
      <th mat-header-cell *matHeaderCellDef>Analista</th>
      <td mat-cell *matCellDef="let a">{{ a.analistaAsignado }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let a">
        <div class="pv-btn-group">
          <a matButton="outlined" [routerLink]="['/contenedores', a.containerId]">Ver contenedor</a>
          @if (!a.leida) {
            <button matIconButton class="btn-icon-primary" matTooltip="Marcar como leída" (click)="marcarLeida(a.id)">
              <mat-icon>mark_email_read</mat-icon>
            </button>
          }
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas()"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas()" [class.selected-row]="!row.leida"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell pv-no-data-cell" [attr.colspan]="columnas().length">No hay alertas para mostrar.</td>
    </tr>
  </table>
</div>
