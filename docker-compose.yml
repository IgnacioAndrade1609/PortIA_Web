services:
  postgres:
    image: postgres:16
    container_name: portia-postgres
    environment:
      POSTGRES_USER: portia
      POSTGRES_PASSWORD: portia123
      POSTGRES_DB: portia_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio
    container_name: portia-minio
    environment:
      MINIO_ROOT_USER: portia
      MINIO_ROOT_PASSWORD: portia12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    container_name: portia-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: portia-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build: ./PortIA_Core
    container_name: portia-core
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=portia_db;Username=portia;Password=portia123"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - postgres
      - rabbitmq

  agentes:
    build: ./PortIA_Agentes
    container_name: portia-agentes
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - redis
      - rabbitmq

volumes:
  postgres_data:
  minio_data: